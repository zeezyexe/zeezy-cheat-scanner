name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (CMake + vcpkg)
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Build (Release)
        run: cmake --build build --config Release

      - name: Stage artifact
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item "build/Release/Zeezy Cheat Scanner.exe" "artifact/Zeezy Cheat Scanner.exe"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: zeezy-cheat-scanner
          path: "artifact/Zeezy Cheat Scanner.exe"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "artifact/Zeezy Cheat Scanner.exe"
          generate_release_notes: true
